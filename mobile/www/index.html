<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flight Ops</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b1f3a; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 112px; height: 112px; object-fit: contain; background: #fff; border-radius: 16px; padding: 6px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #9fb3d1; margin: 0 0 24px; line-height: 1.5; }
      button { font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 10px; background: #1f5fd1; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="" />
      <h1>Can’t reach Flight Ops</h1>
      <p>Check your mobile data or Wi-Fi, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
