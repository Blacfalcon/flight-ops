# Flight Ops — runs the same on a cloud VM or a unit server.
# Start everything:  docker compose up -d --build
# Trial on a PC:     docker compose up -d db minio   (then run the app with npm)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"   # this machine only; 5433 so it never clashes with a PostgreSQL already installed
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  # File storage. MinIO stopped publishing its own images in September 2026;
  # this is Chainguard's maintained build of the same server.
  # The app creates the storage bucket itself on first use.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "127.0.0.1:9000:9000"   # this machine only
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["web"]
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["worker"]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
